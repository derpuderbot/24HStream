name: Daten aktualisieren & Deploy
on:
  push: {branches: [main]}
  schedule: [{cron: '*/15 * * * *'}]
  workflow_dispatch:
permissions: {contents: write, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node scripts/fetch-data.mjs
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      - name: Daten committen
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add data; git diff --cached --quiet || (git commit -m "chore: Daten aktualisiert [skip ci]" && git push)
      - run: mkdir _site && cp -r index.html config.html css js data _site/
      - uses: actions/upload-pages-artifact@v3
        with: {path: _site}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: '${{ steps.d.outputs.page_url }}'}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
